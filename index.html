
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recursos Didácticos WAMAVET</title>

<style>
:root {
  --bg:#f4f7f7;
  --panel:#ffffff;
  --ink:#243238;
  --muted:#6d7b80;
  --accent:#148a82;
  --line:#dbe4e6;
}

* { box-sizing:border-box; }

html,body {
  margin:0;
  width:100%;
  height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--ink);
}

.app {
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.toolbar {
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 12px;
  background:var(--panel);
  border-bottom:1px solid var(--line);
}

.brand {
  font-size:13px;
  font-weight:bold;
  white-space:nowrap;
  color:var(--accent);
}

#selector {
  flex:1;
  min-width:0;
  height:36px;
  border:1px solid var(--line);
  border-radius:7px;
  padding:0 9px;
  background:#fff;
  color:var(--ink);
  font-size:13px;
  cursor:pointer;
}

#selector:focus {
  outline:2px solid var(--accent);
  outline-offset:1px;
}

.action {
  flex-shrink:0;
  height:36px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:0 11px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#fff;
  color:var(--ink);
  text-decoration:none;
  font-size:12px;
  cursor:pointer;
}

.action:hover { background:#edf7f6; }

.viewer-wrap {
  flex:1;
  min-height:0;
  padding:5px;
  position:relative;
}

#welcome {
  height:100%;
  background:#fff;
  border:1px solid var(--line);
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  padding:25px;
  text-align:center;
}

#welcome h2 {
  font-size:20px;
  margin:0 0 10px;
}

#welcome p {
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
  max-width:550px;
}

#viewer {
  width:100%;
  height:100%;
  border:0;
  border-radius:7px;
  background:white;
  display:none;
}

#status {
  position:absolute;
  bottom:12px;
  left:12px;
  right:12px;
  padding:10px;
  background:#fff5e7;
  border:1px solid #ebcc90;
  border-radius:6px;
  color:#67470c;
  font-size:12px;
  display:none;
}

@media(max-width:650px) {
  .toolbar { gap:5px; padding:6px; }
  .brand { display:none; }
  .action { padding:0 7px; }
  #selector { font-size:12px; }
  .viewer-wrap { padding:2px; }
}
</style>
</head>

<body>
<div class="app">

  <div class="toolbar">
    <span class="brand">WAMAVET</span>

    <select id="selector" aria-label="Seleccionar documento">
      <option value="">Cargando documentos...</option>
    </select>

    <button class="action" id="refreshBtn"
            title="Actualizar listado">↻</button>

    <button class="action" id="homeBtn"
            title="Inicio">Inicio</button>

    <a class="action" id="openBtn"
       href="#" target="_blank" rel="noopener noreferrer"
       style="display:none">↗</a>
  </div>

  <div class="viewer-wrap">

    <div id="welcome">
      <h2>Manuales de prácticas WAMAVET</h2>
      <p>
        Selecciona un manual en el desplegable superior.
        El documento aparecerá aquí sin salir de WAMAVET.
      </p>
    </div>

    <iframe id="viewer"
            title="Visor de documentos"
            allowfullscreen></iframe>

    <div id="status" role="alert"></div>
  </div>

</div>

<script>
// PEGA AQUÍ LA URL DE TU APLICACIÓN GOOGLE APPS SCRIPT
const URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbyOr1r9whvwLGal6zrZo7gTfLuoJAux0cxl9qmkDk8Zp1RWUFoE7P_AGhoo_Nar8P4D/exec';

// Hoja de cálculo ya utilizada anteriormente.
const HOJA = {
  nombre: 'Enlaces a cuadernos de prácticas',
  src: 'https://docs.google.com/spreadsheets/d/1MdF6MIYcXnWUPkNbEkPz-o1xnVr2V0T3d8DErqkXiMk/preview',
  open: 'https://docs.google.com/spreadsheets/d/1MdF6MIYcXnWUPkNbEkPz-o1xnVr2V0T3d8DErqkXiMk/edit'
};

const selector = document.getElementById('selector');
const viewer = document.getElementById('viewer');
const welcome = document.getElementById('welcome');
const openBtn = document.getElementById('openBtn');
const status = document.getElementById('status');
const refreshBtn = document.getElementById('refreshBtn');

let documentos = [];
let peticion = 0;

function mostrarError(mensaje) {
  status.textContent = mensaje;
  status.style.display = 'block';
}

function ocultarError() {
  status.style.display = 'none';
}

function agregarOpcion(valor, texto) {
  const opcion = document.createElement('option');
  opcion.value = valor;
  opcion.textContent = texto;
  selector.appendChild(opcion);
}

function abrirDocumento(src, url) {
  viewer.src = src;
  viewer.style.display = 'block';
  welcome.style.display = 'none';
  openBtn.href = url;
  openBtn.style.display = 'inline-flex';
  ocultarError();
}

function inicio() {
  selector.value = '';
  viewer.src = 'about:blank';
  viewer.style.display = 'none';
  welcome.style.display = 'flex';
  openBtn.style.display = 'none';
  ocultarError();
}

selector.addEventListener('change', function () {
  const valor = selector.value;

  if (!valor) {
    inicio();
    return;
  }

  if (valor === 'hoja') {
    abrirDocumento(HOJA.src, HOJA.open);
    return;
  }

  const indice = Number(valor);

  if (!Number.isInteger(indice) ||
      indice < 0 ||
      indice >= documentos.length) return;

  const documento = documentos[indice];
  const id = encodeURIComponent(documento.id);

  abrirDocumento(
    'https://drive.google.com/file/d/' + id + '/preview',
    'https://drive.google.com/file/d/' + id + '/view'
  );
});

document.getElementById('homeBtn')
  .addEventListener('click', inicio);

refreshBtn.addEventListener('click', cargarDocumentos);

function reconstruirSelector(anteriores, seleccionado) {
  documentos = anteriores;
  selector.replaceChildren();

  agregarOpcion('', 'Seleccionar manual de prácticas...');
  agregarOpcion('hoja', '▦ Enlaces a cuadernos de prácticas');

  documentos.forEach(function(doc, indice) {
    agregarOpcion(String(indice), 'PDF · ' + doc.nombre);
  });

  if (seleccionado === 'hoja') {
    selector.value = 'hoja';
  } else if (seleccionado) {
    const indice = documentos.findIndex(d => d.id === seleccionado);
    if (indice !== -1) {
      selector.value = String(indice);
    } else {
      inicio();
    }
  }
}

function cargarDocumentos() {
  if (URL_SCRIPT === 'PEGAR_AQUI_URL_SCRIPT') {
    mostrarError('Falta configurar la URL de Google Apps Script.');
    reconstruirSelector([], '');
    return;
  }

  const anterior = selector.value === 'hoja'
    ? 'hoja'
    : documentos[Number(selector.value)]?.id || '';

  const numero = ++peticion;
  const callback = 'wamavetCallback' + numero;
  const script = document.createElement('script');

  refreshBtn.disabled = true;
  ocultarError();

  let terminado = false;

  const temporizador = setTimeout(function() {
    finalizar();
    mostrarError('No se pudo cargar el listado. Revisa la conexión y los permisos.');
  }, 20000);

  function finalizar() {
    if (terminado) return false;
    terminado = true;
    clearTimeout(temporizador);
    refreshBtn.disabled = false;
    script.remove();
    delete window[callback];
    return true;
  }

  window[callback] = function(respuesta) {
    if (!finalizar()) return;

    if (!respuesta || !respuesta.ok ||
        !Array.isArray(respuesta.documentos)) {
      mostrarError('Google Drive no ha podido devolver los documentos.');
      return;
    }

    const lista = respuesta.documentos.filter(function(doc) {
      return doc &&
        typeof doc.id === 'string' &&
        typeof doc.nombre === 'string';
    });

    reconstruirSelector(lista, anterior);
  };

  script.onerror = function() {
    if (finalizar()) {
      mostrarError('Error de conexión con Google Apps Script.');
    }
  };

  const separador = URL_SCRIPT.includes('?') ? '&' : '?';

  script.src = URL_SCRIPT + separador +
    'callback=' + encodeURIComponent(callback) +
    '&t=' + Date.now();

  document.head.appendChild(script);
}

reconstruirSelector([], '');
cargarDocumentos();
</script>
</body>
</html>
